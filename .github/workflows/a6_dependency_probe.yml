name: A6 locked dependency replay
on:
  push:
    branches: [v9/census-evidence]
    paths: [.github/workflows/a6_dependency_probe.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a6-dependency-lock-candidate
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'blazebrt/perp-dex-radar' && github.ref == 'refs/heads/v9/census-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_CONFIG_FILE: /dev/null
      PIP_EXTRA_INDEX_URL: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.12'
      - name: Replay committed candidate lock and capture runtime identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/a6-lock" "$RUNNER_TEMP/a6-wheels"
          python - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          report=dict(schema='v9.a6-runtime-identity/1',source_commit=os.environ['GITHUB_SHA'],
              run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              environment={k:os.environ.get(k) for k in ('ImageOS','ImageVersion','RUNNER_OS','RUNNER_ARCH','RUNNER_ENVIRONMENT')},
              python=sys.version,platform=platform.platform(),files={},resource_qualified=False,promotion_authority=False)
          for name,allowed in [('/etc/environment',{'ImageOS','ImageVersion'}),('/etc/os-release',{'ID','VERSION_ID','PRETTY_NAME'}),
                               ('/imagegeneration/imagedata.json',{'ImageVersion','ImageOS','imageVersion','image_version','image_os'})]:
              try:
                  with Path(name).open('rb') as stream: raw=stream.read(1024*1024+1)
                  if len(raw)>1024*1024: raise ValueError('identity file exceeds bound')
                  text=raw.decode('utf-8')
                  if name.endswith('.json'):
                      data=json.loads(text)
                      fields={k:data[k] for k in allowed if isinstance(data,dict) and k in data and isinstance(data[k],str)}
                  else:
                      fields={}
                      for line in text.splitlines():
                          key,sep,value=line.partition('=')
                          if sep and key.strip() in allowed:
                              fields.setdefault(key.strip(),[]).append(value.strip().strip('"').strip("'"))
                  report['files'][name]=dict(status='READ',sha256=hashlib.sha256(raw).hexdigest(),selected_fields=fields)
              except (OSError,ValueError) as error:
                  report['files'][name]=dict(status='UNAVAILABLE',error_type=type(error).__name__)
          Path(os.environ['RUNNER_TEMP'],'a6-lock','runtime-identity.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          PY
          python -m pip --version > "$RUNNER_TEMP/a6-lock/resolver.txt"
          python -m pip download --no-cache-dir --index-url https://pypi.org/simple --only-binary=:all: \
            --require-hashes --dest "$RUNNER_TEMP/a6-wheels" \
            -r research/v9/a6_dependency_candidate.lock 2>&1 | tee "$RUNNER_TEMP/a6-lock/download.log"
          python tools/v9/control_dependency_lock.py --wheels "$RUNNER_TEMP/a6-wheels" --out "$RUNNER_TEMP/a6-lock/candidate"
          cmp research/v9/a6_dependency_candidate.lock "$RUNNER_TEMP/a6-lock/candidate/requirements.lock"
          cmp research/v9/a6_dependency_candidate_manifest.json "$RUNNER_TEMP/a6-lock/candidate/wheel-manifest.json"
      - name: Install offline in a fresh environment and verify inventory
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/a6-lock-env"
          "$RUNNER_TEMP/a6-lock-env/bin/python" -m pip install --no-index --no-cache-dir --only-binary=:all: \
            --find-links "$RUNNER_TEMP/a6-wheels" --require-hashes --force-reinstall \
            -r "$RUNNER_TEMP/a6-lock/candidate/requirements.lock" 2>&1 | tee "$RUNNER_TEMP/a6-lock/install.log"
          "$RUNNER_TEMP/a6-lock-env/bin/python" -m pip check 2>&1 | tee "$RUNNER_TEMP/a6-lock/pip-check.log"
          "$RUNNER_TEMP/a6-lock-env/bin/python" - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          import numpy, pandas, numba
          from tools.v9.control_outcome_runner import installed_distributions
          root=Path(os.environ['RUNNER_TEMP'])/'a6-lock'
          manifest=json.loads((root/'candidate/wheel-manifest.json').read_bytes())
          expected={r['name']:r['version'] for r in manifest['wheels']}
          actual=installed_distributions()
          assert actual==expected, 'fresh installed inventory differs from candidate wheels'
          report=dict(schema='v9.a6-dependency-installation/1',status='OFFLINE_HASHED_CANDIDATE_INSTALL_VERIFIED',
              source_commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              python_version=sys.version.split()[0],platform=platform.platform(),image_version=os.environ.get('ImageVersion'),
              installed_distributions=actual,lock_sha256=hashlib.sha256((root/'candidate/requirements.lock').read_bytes()).hexdigest(),
              imports=dict(numpy=numpy.__version__,pandas=pandas.__version__,numba=numba.__version__),
              resource_qualified=False,promotion_authority=False)
          (root/'installation.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          PY
      - name: Exercise the synthetic research pipeline under the lock
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/a6-lock-env/bin/python" tools/v9/control_resource_measure.py --out "$RUNNER_TEMP/a6-lock/measurements.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a6-dependency-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a6-lock/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a6-dependency-wheels-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a6-wheels/
          retention-days: 90
          if-no-files-found: error
