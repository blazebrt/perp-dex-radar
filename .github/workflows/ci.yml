name: CI

# Blocking checks. Every step fails the job when its command fails: no continue-on-error, no "|| true".
# Runs on every pull request to main, every push to main and to v8/* branches, and on demand.
# To make a red run block merging, add the two jobs below as required status checks of main
# (Settings > Branches > branch protection rule for main > Require status checks to pass).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "v8/**", "v9/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests and legacy parity
    # Pinned: the golden digests compare floating-point results, which can differ in the last digit between
    # system math libraries. ubuntu-latest moves to Ubuntu 26 from October 19, 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: All unit tests
        run: python -m unittest discover -s tests -v

      - name: v8 tests (Phase 1 audit; Phase 2 identity, liquidity and the delta validator; Phase 3 identity coverage, smart-money identity and journal provenance; Phase 3 closure quant and radar evidence; Phase 4 candidate identity evidence; Phase 5 economic exposure; Phase 6 exposure-local ticker authority; Phase 7 full-universe discovery; Phase 8 point-in-time history and research; Phase 8 post-merge hotfix; Phase 9 strategy authority; Phase 10 portfolio and risk realism; Phase 11 unified decision engine; Phase 12 production desk)
        run: python -m unittest tests.test_v8_units tests.test_v8_audit tests.test_v8_identity tests.test_v8_delta tests.test_v8_phase3 tests.test_v8_phase3_smart tests.test_v8_phase3_journal tests.test_v8_phase3_closure tests.test_v8_phase4 tests.test_v8_phase5 tests.test_v8_phase6 tests.test_v8_phase7 tests.test_v8_phase8 tests.test_v8_phase8_hotfix tests.test_v8_phase9 tests.test_v8_phase10 tests.test_v8_phase11 tests.test_v8_phase12 tests.test_v8_research_publication -v

      - name: Shadow experiment ledger is append-only and valid (v8 Phase 8)
        run: python tools/v8/ledger_guard.py

      - name: Legacy parity against this branch's committed golden digests
        run: python tools/v8/legacy_parity.py --out "$RUNNER_TEMP/parity_head" --check tests/fixtures/v8/legacy_parity_golden_phase12.json

      - name: Differential parity against the phase base (approved deltas only)
        # Phase 12 changes published pages only (the Perp Decision Desk): no universe, identity, decision, signal,
        # ranking, stop, size or journal may change. Every changed or new page (Today as index.html, the Analyzer,
        # Funding, Portfolio, Research, the shared desk.js / desk.css and the four demoted diagnostic pages) is pinned
        # to its exact base and head digest in the manifest. Both the frozen base and this branch must reproduce their
        # respective golden digests.
        run: |
          MANIFEST=tests/fixtures/v8/phase12_expected_deltas.json
          BASE_SHA=$(python -c "import json; print(json.load(open('$MANIFEST'))['base']['sha'])")
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          python tools/v8/delta_parity.py --base-root "$RUNNER_TEMP/base" --manifest "$MANIFEST" --work "$RUNNER_TEMP/delta" --write-report "$RUNNER_TEMP/delta/report.json"

      - name: The desk renders a decision built by the engine truthfully (v8 Phase 12)
        run: |
          python -c "import json, sys; sys.path[:0] = ['.', 'tests']; import test_v8_phase12 as T; json.dump(T.mixed(book=T.SMALL), open('$RUNNER_TEMP/desk_decision.json', 'w'))"
          node tools/v8/desk_check.js "$RUNNER_TEMP/desk_decision.json"

      - name: Workflow files parse
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python -c "import glob, yaml; [yaml.safe_load(open(f)) for f in sorted(glob.glob('.github/workflows/*.yml'))]; print('workflows OK')"

  research-checks:
    name: Simulator and no-edge checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the simulator's libraries
        run: python -m pip install --disable-pip-version-check numpy numba pandas

      - name: Simulator tests
        run: python tools/research/test_qsim.py

      - name: Point-in-time research tests (v8 Phase 8 and its post-merge hotfix; time-varying slippage, observed funding, qualification, parity with qsim, the day-pick selection authority, cutoffs before the history, liquidity precision)
        run: python -m unittest tests.test_v8_phase8 tests.test_v8_phase8_hotfix tests.test_v8_phase9 tests.test_v8_phase10 tests.test_v8_phase11 tests.test_v9_evidence -v

      - name: No-edge check (no strategy may make money on a random market)
        run: python tools/no_edge_check.py
