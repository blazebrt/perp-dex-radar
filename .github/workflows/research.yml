name: Research

# Runs on every push to a branch whose name starts with "v5", "v6" or "v7" or to a v8 phase branch
# ("v8/phase-...") (and on demand): the tests,
# one scan, two runs of the smart-money engine, one run of the quant desk and one of the coin picks on live
# exchange data, each with a new journal, then the dashboard from those files. Nothing is published. The
# Phase runs replace only "research" for review. A daily/current-main run may atomically publish validated
# evidence to "research-production". Neither channel changes runtime policy or promotes a strategy.

on:
  push:
    branches: ["v5*", "v6*", "v7*", "v8/phase-*"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # Daily 03:17 UTC: low-frequency evidence refresh, separate from market scans.

permissions:
  contents: write
  actions: read     # v8 Phase 8: list and download this repository's v8-audit-* scan artifacts (read only)

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: |
          rc=0
          python -m unittest discover -s tests -v > research_tests.txt 2>&1 || rc=$?
          tail -5 research_tests.txt
          test "$rc" -eq 0

      - name: Scanner on live exchange data (no backtest, nothing published)
        continue-on-error: true
        run: |
          python scanner.py --out out_new --replay-days 0 > research_scan_new.txt 2>&1 || true
          tail -15 research_scan_new.txt

      - name: Smart money on live Hyperliquid data (two scans, new journal, nothing published)
        continue-on-error: true
        run: |
          python smart.py --out out_new --journal none.json > research_smart.txt 2>&1 || true
          cp out_new/data/smart_journal.json smart_journal_1.json 2>/dev/null || true
          sleep 90
          python smart.py --out out_new --journal smart_journal_1.json >> research_smart.txt 2>&1 || true
          tail -15 research_smart.txt

      - name: Quant desk on live exchange data (new journal, nothing published)
        continue-on-error: true
        run: |
          python quant.py --out out_new --journal none.json > research_quant.txt 2>&1 || true
          tail -15 research_quant.txt

      - name: Coin picks on live exchange data (new journal, nothing published)
        continue-on-error: true
        run: |
          python picks.py --out out_new --journal none.json > research_picks.txt 2>&1 || true
          tail -15 research_picks.txt

      - name: Dashboard from this run's files
        continue-on-error: true
        run: |
          python dashboard.py --out out_new > research_dashboard.txt 2>&1 || true
          tail -5 research_dashboard.txt

      - name: v8 audit snapshot from this run's files (observability only, nothing published)
        continue-on-error: true
        run: |
          python -m v8.snapshot --out out_new --archive-dir v8_archive > research_v8.txt 2>&1 || true
          tail -5 research_v8.txt
          python -c "import json; s = json.load(open('out_new/data/v8/audit_latest.json')); json.dump({'manifest': s['manifest'], 'summary': s['coverage']['summary'], 'engines': s['coverage']['engines'], 'registry_counts': s['registry']['counts'], 'data_health': {k: v for k, v in s['data_health'].items() if k != 'registry_venues'}, 'venues': s['data_health'].get('registry_venues'), 'storage': s['storage']}, open('research_v8_summary.json', 'w'), indent=1)" >> research_v8.txt 2>&1 || true

      - name: Phase base engines on the same live data (comparison only, nothing published)
        # The phase base (the base commit of the expected-delta manifest: since the Phase 8 hotfix, production main f142bb1) runs
        # the scanner, the quant desk and the coin picks on live data right after this branch, so the reports can list
        # every production output the change removes or adds. The two runs are minutes apart; the reports say which
        # differences the change explains.
        continue-on-error: true
        run: |
          BASE_SHA=$(python -c "import json; print(json.load(open('tests/fixtures/v8/phase12_expected_deltas.json'))['base']['sha'])")
          echo "phase base $BASE_SHA" > research_base.txt
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA" >> research_base.txt 2>&1 || true
          cd "$RUNNER_TEMP/base"
          python scanner.py --out "$GITHUB_WORKSPACE/out_base" --replay-days 0 >> "$GITHUB_WORKSPACE/research_base.txt" 2>&1 || true
          python quant.py --out "$GITHUB_WORKSPACE/out_base" --journal none.json >> "$GITHUB_WORKSPACE/research_base.txt" 2>&1 || true
          python picks.py --out "$GITHUB_WORKSPACE/out_base" --journal none.json >> "$GITHUB_WORKSPACE/research_base.txt" 2>&1 || true
          tail -15 "$GITHUB_WORKSPACE/research_base.txt"

      - name: v8 universe identity report (collisions, identity states, default-crypto inventory, unverified assets, venue fields, production changes)
        continue-on-error: true
        run: |
          python tools/v8/identity_report.py out_new/data/v8/audit_latest.json --json research_identity.json --base-out out_base > research_identity.txt 2>&1 || true
          head -60 research_identity.txt

      - name: Candidate identity evidence census and qualification gate (v8 Phase 4; read-only, nothing promoted)
        # Every candidate venue field (Aster underlyingType / underlyingSubType, Lighter strategy_index, insurance fund,
        # market flags, settlement assets) against verified identity, and every candidate rule through the Phase 4
        # gate, on up to three observations: this run (the exact head on live data), the latest production scan (the
        # published audit snapshot) and the previous Research run (kept on the research branch). Evidence only.
        continue-on-error: true
        run: |
          OBS="out_new/data/v8/audit_latest.json"
          if curl -fsS "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/v8/audit_latest.json" -o production_audit_latest.json 2> research_candidate_census.txt; then OBS="$OBS production_audit_latest.json"; fi
          if git fetch -q origin research 2>> research_candidate_census.txt && git show FETCH_HEAD:new_audit_latest.json.gz > previous_research_audit.json.gz 2>> research_candidate_census.txt; then OBS="$OBS previous_research_audit.json.gz"; else rm -f previous_research_audit.json.gz; fi
          python tools/v8/candidate_census.py $OBS --json research_candidate_census.json >> research_candidate_census.txt 2>&1 || true
          head -120 research_candidate_census.txt

      - name: Economic exposure safety (v8 Phase 5; read-only) - crypto authority inventory and Extended Crypto models
        # On the same observations as the census: who holds crypto authority under v8.identity/2 (the known-crypto
        # list, Extended category Crypto, both, other), and every asset that changes state when Extended Crypto is
        # wrapper evidence only (model 2, production since Phase 5) or needs the known-crypto list (model 3), with
        # liquidity, the tokenized-RWA and collision controls, and the outputs of the phase base's run on the same
        # live data. The exact-head observation also carries every Lighter market's token-list check.
        continue-on-error: true
        run: |
          OBS="out_new/data/v8/audit_latest.json"
          if [ -f production_audit_latest.json ]; then OBS="$OBS production_audit_latest.json"; fi
          if [ -f previous_research_audit.json.gz ]; then OBS="$OBS previous_research_audit.json.gz"; fi
          python tools/v8/exposure_safety.py $OBS --outputs out_base/data --json research_exposure_safety.json > research_exposure_safety.txt 2>&1 || true
          head -150 research_exposure_safety.txt

      - name: Known-crypto ticker authority vs exposure binding (v8 Phase 6; read-only)
        # On the same observations: every known-crypto ticker resolved under v8.identity/3 (its exposures, contracts,
        # venues, prices, evidence, exposure checks, class, authority and category), the binding candidates, model 1
        # (/3), model 2 (single-candidate binding, computed independently and compared with this checkout's
        # v8.identity/4: v4_check differences must be 0) and model 3 (heuristic winners, evaluated only), every
        # projected transition with liquidity, the open positions and outputs of the production journal (the
        # journal-data branch), and the known-crypto list audit.
        continue-on-error: true
        run: |
          mkdir -p journal_data
          for f in latest.json quant.json quant_journal.json picks.json picks_journal.json smart.json smart_journal.json journal.csv dashboard.json; do
            git show "origin/journal-data:$f" > "journal_data/$f" 2>/dev/null || rm -f "journal_data/$f"
          done
          OBS="out_new/data/v8/audit_latest.json"
          if [ -f production_audit_latest.json ]; then OBS="$OBS production_audit_latest.json"; fi
          if [ -f previous_research_audit.json.gz ]; then OBS="$OBS previous_research_audit.json.gz"; fi
          python tools/v8/ticker_binding.py $OBS --outputs journal_data --json research_ticker_binding.json > research_ticker_binding.txt 2>&1 || true
          head -200 research_ticker_binding.txt

      - name: Published smart journal under the Phase 3 evidence rules (read-only; the copy on the journal-data branch)
        continue-on-error: true
        run: |
          git show origin/journal-data:smart_journal.json > published_smart_journal.json 2> research_smart_journal.txt || true
          python tools/v8/smart_journal_evidence.py published_smart_journal.json --json research_smart_journal.json >> research_smart_journal.txt 2>&1 || true
          head -60 research_smart_journal.txt

      - name: Published quant journal replayed by this branch and by the base (live data, nothing published)
        # v8 Phase 3 closure: the production quant journal (the copy on the journal-data branch) runs through both
        # versions of quant.py; the report shows the actionable and identity-blocked open positions, every open
        # position's current identity, qualified vs legacy trades, the live record before and after, the dashboard's
        # quant signals and the Analyzer's answer for every blocked coin. The input file is never written.
        continue-on-error: true
        run: |
          git show origin/journal-data:quant_journal.json > published_quant_journal.json 2> research_quant_evidence.txt || true
          python quant.py --out out_pubq --journal published_quant_journal.json >> research_quant_evidence.txt 2>&1 || true
          (cd "$RUNNER_TEMP/base" && python quant.py --out "$GITHUB_WORKSPACE/out_pubq_base" --journal "$GITHUB_WORKSPACE/published_quant_journal.json") >> research_quant_evidence.txt 2>&1 || true
          python tools/v8/closure_evidence_report.py quant --head out_pubq --base out_pubq_base --journal published_quant_journal.json --json research_quant_evidence.json >> research_quant_evidence.txt 2>&1 || true
          tail -80 research_quant_evidence.txt

      - name: Published radar journal under the base's and this branch's learning, and one scan each with it (nothing published)
        # v8 Phase 3 closure: the production radar journal (journal.json from the published site) is classified -
        # backtest, identity-qualified live, legacy live, twins and their pairs, the identity of the coins of legacy
        # rows - and learned by both versions (strategy statuses and live records before and after the quarantine);
        # then both versions scan live data with it, to list every published output the quarantine changes.
        continue-on-error: true
        run: |
          curl -fsS "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/journal.json" -o published_radar_journal.json 2> research_radar_evidence.txt || true
          cp published_radar_journal.json radar_journal_head.json 2>/dev/null || true
          cp published_radar_journal.json radar_journal_base.json 2>/dev/null || true
          python scanner.py --out out_pubr --journal radar_journal_head.json --replay-days 0 >> research_radar_evidence.txt 2>&1 || true
          (cd "$RUNNER_TEMP/base" && python scanner.py --out "$GITHUB_WORKSPACE/out_pubr_base" --journal "$GITHUB_WORKSPACE/radar_journal_base.json" --replay-days 0) >> research_radar_evidence.txt 2>&1 || true
          python tools/v8/closure_evidence_report.py radar --journal published_radar_journal.json --base-root "$RUNNER_TEMP/base" --authority out_new/data/v8/identity_authority.json --head-latest out_pubr/data/latest.json --base-latest out_pubr_base/data/latest.json --json research_radar_evidence.json >> research_radar_evidence.txt 2>&1 || true
          tail -80 research_radar_evidence.txt

      - name: Full-universe discovery (v8 Phase 7; read-only) - discovery report, production coverage census, quant lifecycle check
        # This run's data/v8/discovery.json (the exact head on live data: every active perp of every healthy venue,
        # stages, deep-research reasons, lanes, flags, the emerging census, the shadow queue against the legacy stage 2,
        # unaccounted 0), the coverage census of the latest production snapshot (the pre-Phase-7 baseline), and the
        # quant audit of the published quant journal replayed by this branch: its consistency problems (Phase 7 removes
        # "published quant signals/positions differ from the ledger's SURFACED") and the positions recorded for their
        # lifecycle only. Nothing here makes a request or decides anything.
        continue-on-error: true
        run: |
          OBS="out_new/data/v8/discovery.json"
          if [ -f production_audit_latest.json ]; then OBS="$OBS production_audit_latest.json"; fi
          QP=""
          if [ -f out_pubq/data/v8/parts/quant.json ]; then QP="--quant-part out_pubq/data/v8/parts/quant.json"; fi
          if [ -f out_pubq_base/data/v8/parts/quant.json ]; then QP="$QP --quant-part out_pubq_base/data/v8/parts/quant.json"; fi
          python tools/v8/discovery_report.py $OBS $QP --json research_discovery.json > research_discovery.txt 2>&1 || true
          head -150 research_discovery.txt

      - name: Point-in-time history and corrected research (v8 Phase 8; read-only, nothing published, nothing promoted)
        # 1. The production history (the v8-history branch, when it exists) is exported and verified, read only.
        # 2. Dry run of the history writer on this runner only: a throwaway bare repository receives this run's own
        #    observation and every unexpired v8-audit-* production scan artifact (backfill, each citing its artifact),
        #    through the same GitStore code the Scan workflow uses; the result is verified and kept as an artifact of
        #    this review (history_dryrun.tar.gz). Nothing is pushed to this repository.
        # 3. The measured storage projection at production scale (this run's snapshot, 72 scans a day, 3 days).
        # 4. tools/research/pit_research.py on the market-data branch and the history (the production one when it
        #    verifies, else the dry run): legacy results labelled LEGACY_SURVIVORSHIP_UNQUALIFIED next to the
        #    point-in-time corrected ones, the qualified window and every trade's qualification. A separate file
        #    (research_pit.json); quant_research.json and picks_research.json are not touched.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy numba pandas > research_pit.txt 2>&1 || true
          HIST=""
          if git fetch -q origin "+refs/heads/v8-history:refs/remotes/origin/v8-history" 2>> research_pit.txt; then
            mkdir -p hist_prod && git archive origin/v8-history | tar -x -C hist_prod
            if python -m v8.history verify --dir hist_prod > research_history_verify.json 2>> research_pit.txt; then HIST=hist_prod; fi
            echo "production history: $(git rev-parse origin/v8-history)" >> research_pit.txt
          else
            echo "production history: the v8-history branch does not exist yet" >> research_pit.txt
          fi
          git init -q --bare "$RUNNER_TEMP/hist_dryrun.git"
          # the dry run appends to a copy of the production chain when there is one (v8.history/1 records, then this
          # head's v8.history/2 writer), so the mixed chain is proven on the real records; nothing reaches the remote
          if [ -n "$HIST" ]; then git push -q "$RUNNER_TEMP/hist_dryrun.git" "refs/remotes/origin/v8-history:refs/heads/v8-history-dryrun" 2>> research_pit.txt || true; fi
          python -m v8.history dryrun --snapshot out_new/data/v8/audit_latest.json --bare "$RUNNER_TEMP/hist_dryrun.git" --branch v8-history-dryrun --backfill-repo "$GITHUB_REPOSITORY" --json research_history_dryrun.json >> research_pit.txt 2>&1 || true
          mkdir -p hist_dryrun && git --git-dir="$RUNNER_TEMP/hist_dryrun.git" archive v8-history-dryrun | tar -x -C hist_dryrun || true
          python -m v8.history verify --dir hist_dryrun > research_history_dryrun_verify.json 2>> research_pit.txt || true
          tar -czf history_dryrun.tar.gz -C hist_dryrun . 2>> research_pit.txt || true
          if [ -z "$HIST" ]; then HIST=hist_dryrun; fi
          echo "history used by the research: $HIST" >> research_pit.txt
          python -m v8.history project out_new/data/v8/audit_latest.json --days 3 --scans-per-day 72 > research_history_projection.json 2>> research_pit.txt || true
          mkdir -p md && git archive origin/market-data | tar -x -C md 2>> research_pit.txt || echo "market-data branch unavailable" >> research_pit.txt
          python tools/research/pit_research.py --md md --history "$HIST" --cutoff "$(date -u +%s)" --out research_pit.json >> research_pit.txt 2>&1 || true
          # the same research with a cutoff one second before the first history observation: an empty view
          # (HISTORY_EMPTY / BEFORE_PIT_HISTORY), zero qualified rows, never a crash
          # (the first observation of the history actually used: its own verify report)
          if [ "$HIST" = hist_prod ]; then HV=research_history_verify.json; else HV=research_history_dryrun_verify.json; fi
          FIRST=$(python -c "import json,sys; print(int(json.load(open(sys.argv[1]))['first_observed_at']) - 1)" "$HV" 2>> research_pit.txt || echo "")
          echo "cutoff before the history ($HIST, $HV): $FIRST" | tee -a research_pit.txt research_pit_cutoff.txt
          rc=0
          if [ -n "$FIRST" ]; then
            python tools/research/pit_research.py --md md --history "$HIST" --cutoff "$FIRST" --out research_pit_cutoff_before_history.json >> research_pit_cutoff.txt 2>&1 || rc=$?
          else
            rc=2
          fi
          echo "exit $rc" >> research_pit_cutoff.txt
          tail -30 research_pit_cutoff.txt
          tail -60 research_pit.txt

      - name: Phase 9 governed strategy adjudication (mandatory, no promotion)
        run: |
          rc=0
          python -m pip install --disable-pip-version-check --quiet numpy numba pandas >> research_phase9.txt 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then python -m unittest tests.test_v8_phase9 -v >> research_phase9.txt 2>&1 || rc=$?; fi
          # Production refresh evaluates newly accumulated history; review runs retain their deterministic head cutoff.
          CUTOFF="$(git show -s --format=%ct HEAD)"
          if [ "$GITHUB_REF" = refs/heads/main ]; then CUTOFF="$(date -u +%s)"; fi
          if [ "$rc" -eq 0 ]; then python tools/research/strategy_adjudication.py --md md --history hist_prod --cutoff "$CUTOFF" --out . >> research_phase9.txt 2>&1 || rc=$?; fi
          echo "exit $rc" >> research_phase9.txt
          python -c "import json,os; json.dump({'head':os.environ['GITHUB_SHA'],'exit_code':int('$rc')},open('research_phase9_exit.json','w'),sort_keys=True)"
          test "$rc" -eq 0
          python -c "import json; s=json.load(open('research_phase9_summary.json')); assert s['candidate_count'] >= 24; print(s)"

      - name: Phase 10 portfolio-risk authority on this run (mandatory; audit-only, nothing validated by running)
        run: |
          rc=0
          python -m unittest tests.test_v8_phase10 -v >> research_phase10.txt 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then python -c "import json; s=json.load(open('out_new/data/v8/audit_latest.json')); m=s['manifest']['portfolio_risk']; full=s.get('portfolio_risk'); assert m['health']=='PORTFOLIO_RISK_POLICY_OK', m; assert full and full['schema']=='v8.portfolio-risk/1' and full['trace'], 'missing evaluation'; json.dump({'manifest': m, 'evaluation': full}, open('research_phase10_portfolio_risk.json','w'), indent=1, sort_keys=True); print(m['evaluation']['state'], m['evaluation']['breached'], m['evaluation']['missing_authority_count'])" >> research_phase10.txt 2>&1 || rc=$?; fi
          echo "exit $rc" >> research_phase10.txt
          python -c "import json,os; json.dump({'head':os.environ['GITHUB_SHA'],'exit_code':int('$rc')},open('research_phase10_exit.json','w'),sort_keys=True)"
          tail -5 research_phase10.txt
          test "$rc" -eq 0

      - name: Phase 11 unified decision engine on this run (mandatory; truthful even when it is zero TRADE)
        run: |
          rc=0
          python -m unittest tests.test_v8_phase11 -v >> research_phase11.txt 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then python -c "import json; s=json.load(open('out_new/data/v8/audit_latest.json')); d=s['manifest']['decision']; assert d['status']=='OK', d; assert d['trace_available'] and d['portfolio_binding']['consistent'], d; print(d['market_summary'])" >> research_phase11.txt 2>&1 || rc=$?; fi
          if [ "$rc" -eq 0 ]; then python tools/v8/decision_report.py out_new/data/v8/decision.json --json research_phase11_decision.json >> research_phase11.txt 2>&1 || rc=$?; fi
          echo "exit $rc" >> research_phase11.txt
          python -c "import json,os; json.dump({'head':os.environ['GITHUB_SHA'],'exit_code':int('$rc')},open('research_phase11_exit.json','w'),sort_keys=True)"
          tail -12 research_phase11.txt
          test "$rc" -eq 0

      - name: Phase 12 production desk on this run's decision (mandatory; the desk shows the live decision as published, zero TRADE included)
        run: |
          rc=0
          python -m unittest tests.test_v8_phase12 tests.test_v8_research_publication -v >> research_phase12.txt 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then node tools/v8/desk_check.js out_new/data/v8/decision.json research_phase12_desk.json >> research_phase12.txt 2>&1 || rc=$?; fi
          echo "exit $rc" >> research_phase12.txt
          python -c "import json,os; json.dump({'head':os.environ['GITHUB_SHA'],'exit_code':int('$rc')},open('research_phase12_exit.json','w'),sort_keys=True)"
          tail -8 research_phase12.txt
          test "$rc" -eq 0

      - name: Publish validated production research (main only; no promotion)
        if: success() && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          PRODUCTION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python tools/research/production_publication.py build
          python tools/research/production_publication.py publish

      - name: Save the results for review
        if: always() && github.ref != 'refs/heads/main'
        env:
          GIT_AUTHOR_NAME: perp-dex-radar
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: perp-dex-radar
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        run: |
          mkdir -p R
          cp research_*.txt R/ 2>/dev/null || true
          cp research_strategy_*.json research_multiple_testing.json research_matched_controls.json research_phase9_*.json R/ 2>/dev/null || true
          cp research_phase10_*.json R/ 2>/dev/null || true
          cp research_phase11_*.json R/ 2>/dev/null || true
          cp research_phase12_*.json R/ 2>/dev/null || true
          for f in latest.json journal.csv quant.json picks.json smart.json dashboard.json; do
            if [ -f "out_new/data/$f" ]; then cp "out_new/data/$f" "R/new_$f"; fi
          done
          for f in latest.json quant.json picks.json; do
            if [ -f "out_base/data/$f" ]; then cp "out_base/data/$f" "R/base_$f"; fi
          done
          if [ -f out_new/data/v8/audit_latest.json.gz ]; then cp out_new/data/v8/audit_latest.json.gz R/new_audit_latest.json.gz; fi
          if [ -f research_v8_summary.json ]; then cp research_v8_summary.json R/; fi
          if [ -f research_identity.json ]; then cp research_identity.json R/; fi
          if [ -f research_smart_journal.json ]; then cp research_smart_journal.json R/; fi
          if [ -f out_new/data/v8/discovery.json ]; then gzip -9 -n -c out_new/data/v8/discovery.json > R/new_discovery.json.gz; fi
          for f in research_quant_evidence.json research_radar_evidence.json research_candidate_census.json research_exposure_safety.json research_ticker_binding.json research_discovery.json research_pit.json research_history_dryrun.json research_history_dryrun_verify.json research_history_verify.json research_history_projection.json history_dryrun.tar.gz research_pit_cutoff_before_history.json; do
            if [ -f "$f" ]; then cp "$f" R/; fi
          done
          if [ -f out_pubq/data/quant.json ]; then cp out_pubq/data/quant.json R/pub_quant.json; fi
          if [ -f out_pubq_base/data/quant.json ]; then cp out_pubq_base/data/quant.json R/pub_base_quant.json; fi
          echo "$GITHUB_REF_NAME $GITHUB_SHA $(date -u +%Y-%m-%dT%H:%MZ)" > R/run.txt
          export GIT_INDEX_FILE="$RUNNER_TEMP/research.index"
          git read-tree --empty
          for f in R/*; do
            git update-index --add --cacheinfo "100644,$(git hash-object -w "$f"),$(basename "$f")"
          done
          commit=$(git commit-tree "$(git write-tree)" -m "Research run $GITHUB_REF_NAME ${GITHUB_SHA::7}")
          git push --force origin "$commit:refs/heads/research"
