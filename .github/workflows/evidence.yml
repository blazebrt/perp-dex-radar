name: Survivorship-free evidence

# v9: downloads the Binance USD-M public archive (every perpetual that ever traded, delisted ones included), builds the
# point-in-time research universe and re-tests the legacy strategies and the coin-picks swing score on it with
# conservative costs and the Phase 9 statistics. Research only: nothing is published to the site, no strategy is
# promoted. Results replace the "evidence-results" branch; the research dataset replaces the "archive-data" branch
# (one commit each, no history). Runs when the evidence tools change on a v9 branch, or from the Actions tab.

on:
  push:
    branches: ["v9/**"]
    paths: ["tools/v9/archive_fetch.py", "tools/v9/evidence.py", ".github/workflows/evidence.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidence
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the research libraries
        run: python -m pip install --disable-pip-version-check --quiet numpy pandas numba

      - name: Month key for the archive cache
        id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: bn_cache
          key: bn-archive-4h-v1-${{ steps.month.outputs.m }}
          restore-keys: bn-archive-4h-v1-

      - name: Download the Binance archive (4h candles and funding, every USD-M perpetual)
        run: python tools/v9/archive_fetch.py --out md_bn --cache bn_cache --interval 4h --workers 48 2>&1 | tee fetch.log

      - name: Re-test the strategies on the survivorship-free universe
        run: |
          mkdir -p evidence
          python tools/v9/evidence.py --md md_bn --out evidence 2>&1 | tee evidence/run.txt

      - name: Save the results on the evidence-results branch and the dataset on archive-data
        if: always()
        env:
          GIT_AUTHOR_NAME: perp-dex-radar
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: perp-dex-radar
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        run: |
          mkdir -p evidence
          cp fetch.log evidence/ 2>/dev/null || true
          cp md_bn/universe.json evidence/universe.json 2>/dev/null || true
          echo "$GITHUB_REF_NAME $GITHUB_SHA $(date -u +%Y-%m-%dT%H:%MZ)" > evidence/run_meta.txt
          save() {  # save <folder> <branch> <message>
            export GIT_INDEX_FILE="$RUNNER_TEMP/$2.index"
            rm -f "$GIT_INDEX_FILE"
            git read-tree --empty
            (cd "$1" && find . -type f | sed 's#^\./##' | sort) > "$RUNNER_TEMP/$2.files"
            while read -r f; do
              git update-index --add --cacheinfo "100644,$(git hash-object -w "$1/$f"),$f"
            done < "$RUNNER_TEMP/$2.files"
            commit=$(git commit-tree "$(git write-tree)" -m "$3")
            git push --force origin "$commit:refs/heads/$2"
          }
          save evidence evidence-results "Evidence $GITHUB_REF_NAME ${GITHUB_SHA::7}"
          if [ -f md_bn/universe.json ]; then save md_bn archive-data "Binance archive research layout $(date -u +%Y-%m-%d)"; fi
