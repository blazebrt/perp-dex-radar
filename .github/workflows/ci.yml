name: CI

# Blocking checks. Every step fails the job when its command fails: no continue-on-error, no "|| true".
# Runs on every pull request to main, every push to main and to v8/* branches, and on demand.
# To make a red run block merging, add the two jobs below as required status checks of main
# (Settings > Branches > branch protection rule for main > Require status checks to pass).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "v8/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests and legacy parity
    # Pinned: the golden digests compare floating-point results, which can differ in the last digit between
    # system math libraries. ubuntu-latest moves to Ubuntu 26 from October 19, 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: All unit tests
        run: python -m unittest discover -s tests -v

      - name: v8 tests (Phase 1 audit; Phase 2 identity, liquidity and the delta validator; Phase 3 identity coverage and smart-money identity)
        run: python -m unittest tests.test_v8_units tests.test_v8_audit tests.test_v8_identity tests.test_v8_delta tests.test_v8_phase3 tests.test_v8_phase3_smart -v

      - name: Legacy parity against this branch's committed golden digests
        run: python tools/v8/legacy_parity.py --out "$RUNNER_TEMP/parity_head" --check tests/fixtures/v8/legacy_parity_golden_phase3.json

      - name: Differential parity against the phase base (approved deltas only)
        # Phase 3 changes legacy outputs on purpose. The phase base named in the expected-delta manifest (main
        # 82f8d35, Phase 2) is rebuilt on this runner; it must reproduce its own golden digests, and every difference
        # between it and this checkout must be one the manifest lists (tools/v8/delta_parity.py): anything else fails
        # the job. The Phase 2 manifest (pinned to 15a3794) is kept for the record and no longer checked.
        run: |
          MANIFEST=tests/fixtures/v8/phase3_expected_deltas.json
          BASE_SHA=$(python -c "import json; print(json.load(open('$MANIFEST'))['base']['sha'])")
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          python tools/v8/delta_parity.py --base-root "$RUNNER_TEMP/base" --manifest "$MANIFEST" --work "$RUNNER_TEMP/delta" --write-report "$RUNNER_TEMP/delta/report.json"

      - name: Workflow files parse
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python -c "import glob, yaml; [yaml.safe_load(open(f)) for f in sorted(glob.glob('.github/workflows/*.yml'))]; print('workflows OK')"

  research-checks:
    name: Simulator and no-edge checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the simulator's libraries
        run: python -m pip install --disable-pip-version-check numpy numba

      - name: Simulator tests
        run: python tools/research/test_qsim.py

      - name: No-edge check (no strategy may make money on a random market)
        run: python tools/no_edge_check.py
