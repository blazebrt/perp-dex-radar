name: A6 hosted qualification prerequisites
on:
  push:
    branches: [v9/census-evidence]
    paths: [.github/workflows/a6_qualification_preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a6-qualification-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'blazebrt/perp-dex-radar' && github.ref == 'refs/heads/v9/census-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify environment and record capacity before qualification
        run: python3 tools/v9/control_hosted_preflight.py --out "$RUNNER_TEMP/a6-qualification-preflight.json"
      - name: Preserve prerequisite report on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a6-qualification-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a6-qualification-preflight.json
          if-no-files-found: error
          retention-days: 90
