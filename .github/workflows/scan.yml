name: Scan

on:
  schedule:
    # Every hour at minute 7 (UTC). For every 30 minutes use "7,37 * * * *"
    # and set SCAN_EVERY_MIN below to "30".
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: "Start a new journal (wipes the strategy record and backtests the last 30 days again)"
        type: boolean
        default: false

env:
  SCAN_MINUTE: "7"
  SCAN_EVERY_MIN: "20"

permissions:
  contents: write   # to save a copy of the journal on the journal-data branch (see the last step)
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Core tests (a failure stops the scan here, before anything is built or published)
        id: core_tests
        # The fast unit tests of every engine and of the v8 audit (about 20 seconds), including the identity
        # invariants (v8 Phase 3: no coin without positive identity evidence reaches an engine; unverified coins stay
        # visible) and the evidence boundary (v8 Phase 3 closure: a quant position without crypto execution identity
        # is never actionable, and legacy quant or radar trades never become live evidence or grant a pass), the
        # Phase 4 outcome (no candidate venue field is crypto evidence; candidates are traced, never authority) and the
        # Phase 5 invariants (a crypto wrapper beside tradfi exposure is never crypto-authorized, a wrapper-only unknown
        # and a failed exposure check fail closed, the current gates react to an identity downgrade, entry-time proof
        # stays historical) and the Phase 6 invariants (tests.test_v8_phase6.ScanGateInvariants: one known-crypto
        # exposure binds, two unresolved price exposures of one ticker never both receive crypto, a tradfi collision
        # leaves one bindable exposure, a failed exposure check cannot acquire crypto, a current downgrade blocks
        # actionability, a prior entry proof stays historical). The full suite, the end-to-end legacy parity check and
        # the research checks run in the CI workflow.
        run: >-
          python -m unittest tests.test_v5 tests.test_quant tests.test_picks tests.test_smart
          tests.test_smart_backtest tests.test_dashboard tests.test_analyze tests.test_analyzer_call
          tests.test_v8_units tests.test_v8_identity tests.test_v8_phase3 tests.test_v8_phase3_smart
          tests.test_v8_phase3_journal tests.test_v8_phase3_closure tests.test_v8_phase4 tests.test_v8_phase5
          tests.test_v8_phase6.ScanGateInvariants

      - id: pages
        uses: actions/configure-pages@v5

      - name: Run the scanner
        env:
          RESET: ${{ github.event_name == 'workflow_dispatch' && inputs.reset && '--reset' || '' }}
          # Optional alerts for new strong picks. Add these under Settings > Secrets and variables >
          # Actions > New repository secret. Leave them out and no alerts are sent.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scanner.py --out site --pages-url "${{ steps.pages.outputs.base_url }}" $RESET

      - name: Smart money (what Hyperliquid's proven traders do, and how often it was right)
        id: smart
        continue-on-error: true
        run: python smart.py --out site --pages-url "${{ steps.pages.outputs.base_url }}"

      - name: Keep the smart money files if it failed
        # A failed run must not drop the smart-money record from the site (the next run would start over).
        if: steps.smart.outcome == 'failure'
        run: |
          mkdir -p site/data
          for f in smart.json smart_journal.json smart_research.json; do
            curl -fsS "${{ steps.pages.outputs.base_url }}/data/$f" -o "site/data/$f" || rm -f "site/data/$f"
          done
          cp smart.html site/ || true

      - name: Run the quant desk (long and short trend and momentum strategies)
        id: quant
        continue-on-error: true
        run: python quant.py --out site --pages-url "${{ steps.pages.outputs.base_url }}"

      - name: Keep the quant desk files if it failed
        # A failed run must not drop the quant record from the site (the next run would start over).
        if: steps.quant.outcome == 'failure'
        run: |
          mkdir -p site/data
          for f in quant.json quant_journal.json quant_research.json; do
            curl -fsS "${{ steps.pages.outputs.base_url }}/data/$f" -o "site/data/$f" || rm -f "site/data/$f"
          done
          cp quant.html site/ || true

      - name: Run the coin picks (swing and day-trade scores with their reasons)
        id: picks
        continue-on-error: true
        env:
          # Optional: a free CoinGecko Demo key, added under Settings > Secrets and variables > Actions > New
          # repository secret (name COINGECKO_API_KEY). Without it the public CoinGecko API is used.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # Optional: a free Gemini key (Google AI Studio) for the AI desk notes on the top picks and the AI tone of
          # the news headlines. Add it as a repository secret named GEMINI_API_KEY (the other names work too).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GEMINI || secrets.GOOGLE_API_KEY || secrets.GOOGLE_AI_KEY || secrets.GOOGLE_AI_STUDIO_KEY || secrets.GEMINI_API }}
        run: python picks.py --out site --pages-url "${{ steps.pages.outputs.base_url }}"

      - name: Keep the coin picks if they failed
        # A failed run must not drop the picks record from the site; the picks page stays the front page
        # and the 15-minute radar stays at radar.html.
        if: steps.picks.outcome == 'failure'
        run: |
          mkdir -p site/data
          for f in picks.json picks_journal.json picks_research.json; do
            curl -fsS "${{ steps.pages.outputs.base_url }}/data/$f" -o "site/data/$f" || rm -f "site/data/$f"
          done
          if [ ! -f site/radar.html ]; then cp site/index.html site/radar.html; fi
          cp picks.html site/index.html || true
          cp picks.html site/picks.html || true

      - name: Publish the coin analyzer page
        # The analyzer runs in the browser (it reads exchange data itself), so it is published on every scan.
        if: always()
        run: cp analyze.html analyze.js site/ || true

      - name: Build the dashboard (the front page)
        # One look at all versions, smart money and the accuracy scorecard. If it fails, the front page stays
        # the coin picks page.
        if: always()
        continue-on-error: true
        run: python dashboard.py --out site

      - name: v8 audit snapshot (observability only)
        # Assembles data/v8/audit_latest.json from what the engines above recorded: every DEX contract, every
        # coin's disposition in every engine, data health and provenance. It reads the published files and never
        # changes them, so a problem here must not stop the pages from being published.
        if: always() && steps.core_tests.outcome == 'success'
        continue-on-error: true
        run: python -m v8.snapshot --out site --pages-url "${{ steps.pages.outputs.base_url }}" --archive-dir "$RUNNER_TEMP/v8_archive"

      - name: Keep this scan's audit snapshot for 14 days (Actions artifact; nothing is stored permanently)
        if: always() && steps.core_tests.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v8-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v8_archive/
          retention-days: 14
          if-no-files-found: ignore

      - name: Save a copy of the journal for review
        # Replaces the journal-data branch with this scan's latest.json, journal.csv and the quant desk's
        # and coin picks' files (one commit, no history), so the results can be read from the repository.
        if: always()
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: perp-dex-radar
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: perp-dex-radar
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        run: |
          test -f site/data/latest.json || exit 0
          export GIT_INDEX_FILE="$RUNNER_TEMP/journal.index"
          git read-tree --empty
          for f in latest.json journal.csv quant.json quant_journal.json picks.json picks_journal.json dashboard.json smart.json smart_journal.json; do
            if [ -f "site/data/$f" ]; then
              git update-index --add --cacheinfo "100644,$(git hash-object -w "site/data/$f"),$f"
            fi
          done
          commit=$(git commit-tree "$(git write-tree)" -m "Journal snapshot $(date -u +%Y-%m-%dT%H:%MZ)")
          git push --force origin "$commit:refs/heads/journal-data"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Keep the hourly schedule switched on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scan.yml/enable" || true
