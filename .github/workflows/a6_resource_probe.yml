name: A6 synthetic resource pilot

on:
  push:
    branches: [v9/census-evidence]
    paths: [.github/workflows/a6_resource_probe.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a6-synthetic-resource-pilot
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'blazebrt/perp-dex-radar' && github.ref == 'refs/heads/v9/census-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.12'
      - name: Capture pilot environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/a6-pilot"
          python - <<'PY'
          import json, os, platform, sys
          from pathlib import Path
          report = dict(schema='v9.a6-hosted-pilot-environment/1',
              source_commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], python=sys.version,
              platform=platform.platform(), runner_os=os.environ['RUNNER_OS'],
              runner_arch=os.environ['RUNNER_ARCH'], image_os=os.environ.get('ImageOS'),
              image_version=os.environ.get('ImageVersion'), synthetic_only=True,
              resource_qualified=False, promotion_authority=False)
          Path(os.environ['RUNNER_TEMP'], 'a6-pilot', 'environment.json').write_text(json.dumps(report, indent=2)+'\n')
          PY
          git --version > "$RUNNER_TEMP/a6-pilot/git-version.txt"
      - name: Install pilot dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 pandas==2.2.3 numba==0.61.2 2>&1 | tee "$RUNNER_TEMP/a6-pilot/install.log"
          python -m pip freeze --all > "$RUNNER_TEMP/a6-pilot/dependencies.txt"
      - name: Measure eight synthetic scenarios
        shell: bash
        run: |
          set -euo pipefail
          python tools/v9/control_resource_measure.py --out "$RUNNER_TEMP/a6-pilot/measurements.json" 2>&1 | tee "$RUNNER_TEMP/a6-pilot/probe.log"
          sha256sum "$RUNNER_TEMP/a6-pilot/measurements.json" > "$RUNNER_TEMP/a6-pilot/measurements.sha256"
          cat "$RUNNER_TEMP/a6-pilot/measurements.json"
      - name: Retain pilot diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a6-synthetic-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a6-pilot/
          if-no-files-found: error
          retention-days: 90
