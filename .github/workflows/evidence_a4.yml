name: Phase A4 census replay
# Retry after preflight fingerprint-order correction; no trials ran in attempt 1.

on:
  push:
    branches: ["v9/census-evidence"]
    paths: [".github/workflows/evidence_a4.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidence-a4
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research libraries
        run: python -m pip install --disable-pip-version-check --quiet numpy pandas numba
      - name: Validate inventory and synthetic replay
        run: python -m unittest tests.test_v9_census_plan tests.test_v9_census_replay -v
      - name: Fetch the exact archive and phase B evidence
        env:
          ARCHIVE_SHA: 4828a2dbf69e0f7e66c97af7fbc0c9a1f24cccc7
          EVIDENCE_SHA: e4c0f0d8a5926ab54dd17da9ba7309518c77f611
        run: |
          mkdir -p md_bn
          git fetch --no-tags --depth=1 origin "$ARCHIVE_SHA" "$EVIDENCE_SHA"
          git archive "$ARCHIVE_SHA" | tar -x -C md_bn
          git show "$EVIDENCE_SHA:evidence.json" > phase_b_evidence.json
          printf 'archive-data %s\nevidence-results %s\n' "$ARCHIVE_SHA" "$EVIDENCE_SHA" > dataset_ref.txt
      - name: Replay the known four-hour and daily definitions
        id: replay
        run: |
          python tools/v9/census_replay.py --md md_bn --out evidence_a4 \
            --phase-b-evidence phase_b_evidence.json 2>&1 | tee a4_run.txt
      - name: Preserve results or failure diagnostics on the research results branch
        if: always()
        env:
          GIT_AUTHOR_NAME: perp-dex-radar
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: perp-dex-radar
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        run: |
          mkdir -p evidence_a4
          [ ! -f a4_run.txt ] || cp a4_run.txt evidence_a4/run.txt
          [ ! -f dataset_ref.txt ] || cp dataset_ref.txt evidence_a4/dataset_ref.txt
          printf '%s %s %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%MZ)" > evidence_a4/run_meta.txt
          printf '%s\n' "$REPLAY_OUTCOME" > evidence_a4/run_outcome.txt
          export GIT_INDEX_FILE="$RUNNER_TEMP/a4.index"
          git read-tree --empty
          while IFS= read -r -d '' file; do
            git update-index --add --cacheinfo "100644,$(git hash-object -w "$file"),${file#evidence_a4/}"
          done < <(find evidence_a4 -type f -print0)
          commit=$(git commit-tree "$(git write-tree)" -m "A4 replay $GITHUB_SHA: $REPLAY_OUTCOME")
          git push --force origin "$commit:refs/heads/evidence-a4-results"
