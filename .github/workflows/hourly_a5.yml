name: Phase A5 hourly archive

on:
  push:
    branches: ["v9/census-evidence"]
    paths: [".github/workflows/hourly_a5.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-a5
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate causal selection and collector with synthetic inputs
        run: python -m unittest tests.test_v9_hourly_plan tests.test_v9_hourly_fetch -v
      - name: Fetch the pinned four-hour source archive
        env:
          ARCHIVE_SHA: 4828a2dbf69e0f7e66c97af7fbc0c9a1f24cccc7
        run: |
          mkdir md_bn
          git fetch --no-tags --depth=1 origin "$ARCHIVE_SHA"
          git archive "$ARCHIVE_SHA" | tar -x -C md_bn
          printf 'archive-data %s\n' "$ARCHIVE_SHA" > dataset_ref.txt
      - name: Build daily top-150 schedule without hourly prices
        run: python tools/v9/hourly_plan.py --md md_bn --out hourly_plan.json
      - name: Collect hourly data and reconcile it with the pinned source
        id: collect
        run: |
          python tools/v9/hourly_fetch.py --md md_bn --plan hourly_plan.json \
            --out hourly_a5 --cache hourly_cache --workers 8 2>&1 | tee a5_run.txt
      - name: Preserve hourly dataset or failed-attempt diagnostics
        if: always()
        env:
          GIT_AUTHOR_NAME: perp-dex-radar
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: perp-dex-radar
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          mkdir -p hourly_a5
          [ ! -f hourly_plan.json ] || cp hourly_plan.json hourly_a5/hourly_plan.json
          [ ! -f a5_run.txt ] || cp a5_run.txt hourly_a5/run.txt
          [ ! -f dataset_ref.txt ] || cp dataset_ref.txt hourly_a5/dataset_ref.txt
          printf '%s %s %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%MZ)" > hourly_a5/run_meta.txt
          printf '%s\n' "$COLLECT_OUTCOME" > hourly_a5/run_outcome.txt
          export GIT_INDEX_FILE="$RUNNER_TEMP/a5.index"
          git read-tree --empty
          while IFS= read -r -d '' file; do
            git update-index --add --cacheinfo "100644,$(git hash-object -w "$file"),${file#hourly_a5/}"
          done < <(find hourly_a5 -type f -print0)
          commit=$(git commit-tree "$(git write-tree)" -m "A5 hourly collection $GITHUB_SHA: $COLLECT_OUTCOME")
          git push --force origin "$commit:refs/heads/hourly-a5-results"
