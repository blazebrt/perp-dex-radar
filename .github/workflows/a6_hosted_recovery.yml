name: A6 synthetic cross-runner recovery

on:
  push:
    branches: [v9/census-evidence]
    paths: [.github/workflows/a6_hosted_recovery.yml]

permissions:
  contents: read

concurrency:
  group: a6-synthetic-cross-runner-recovery
  cancel-in-progress: false

jobs:
  produce:
    if: github.repository == 'blazebrt/perp-dex-radar' && github.ref == 'refs/heads/v9/census-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      transfer_digest: ${{ steps.produce.outputs.transfer_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: produce
        name: Build small synthetic state and remove original workspaces
        run: python tools/v9/control_hosted_recovery.py produce --out "$RUNNER_TEMP/a6-transfer"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a6-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a6-transfer/transfer/
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  recover:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.produce.outputs.artifact_id }}
          path: ${{ runner.temp }}/a6-downloaded
          merge-multiple: true
      - name: Verify exact transferred bytes and refuse recomputation
        env:
          TRANSFER_DIGEST: ${{ needs.produce.outputs.transfer_digest }}
        run: python tools/v9/control_hosted_recovery.py recover --transfer "$RUNNER_TEMP/a6-downloaded" --out "$RUNNER_TEMP/a6-recovered" --expected-digest "$TRANSFER_DIGEST"
      - name: Retain small recovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a6-recovery-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a6-recovered/report.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
