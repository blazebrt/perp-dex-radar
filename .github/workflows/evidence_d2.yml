name: Phase D2 evidence

# v9 phase D2: tests the two pre-registered positioning strategies (docs/v9/phase-d2-preregistration.md: XS_TOP_DIV
# and XS_CROWD_FADE) once, on the survivorship-free Binance archive ("archive-data", the dataset phase B was tested
# on) and Binance's metrics ("archive-metrics", built by metrics.yml). Research only: nothing is published to the site
# and no strategy is promoted. Results replace the "evidence-d2-results" branch (one commit, no history). Runs when
# the D2 tools change on a v9 branch, or from the Actions tab.

on:
  push:
    branches: ["v9/**"]
    paths: ["tools/v9/d2.py", "tools/v9/evidence_d2.py", ".github/workflows/evidence_d2.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidence-d2
  cancel-in-progress: true

jobs:
  d2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash          # bash -eo pipefail: a failed run fails its step even when piped to tee
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the research libraries
        run: python -m pip install --disable-pip-version-check --quiet numpy pandas numba

      - name: The D2 definitions (rankings, the one-day lag, the 12-of-18 rule) on the synthetic archive
        run: python -m unittest tests.test_v9_d2 -v

      # The study runs only once the metrics dataset exists (metrics.yml builds archive-metrics). Without it, this run
      # tests nothing and saves nothing; push a change to this workflow afterwards to run the study once.
      - name: Is the metrics dataset built yet?
        id: data
        run: |
          if git ls-remote --exit-code origin refs/heads/archive-metrics > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::archive-metrics does not exist yet: nothing is tested in this run."
          fi

      - name: Check out the research datasets (archive-data, archive-metrics) and phase B's evidence
        if: steps.data.outputs.ready == 'true'
        run: |
          mkdir -p evidence_d2 md_bn md_metrics
          git fetch --no-tags --depth=1 origin \
            +refs/heads/archive-data:refs/remotes/origin/archive-data \
            +refs/heads/archive-metrics:refs/remotes/origin/archive-metrics \
            +refs/heads/evidence-results:refs/remotes/origin/evidence-results
          git archive origin/archive-data | tar -x -C md_bn
          git archive origin/archive-metrics | tar -x -C md_metrics
          git show origin/evidence-results:evidence.json > phase_b_evidence.json
          {
            echo "archive-data $(git rev-parse origin/archive-data)"
            echo "archive-metrics $(git rev-parse origin/archive-metrics)"
            echo "evidence-results $(git rev-parse origin/evidence-results)"
          } > evidence_d2/dataset_ref.txt
          cat evidence_d2/dataset_ref.txt
          echo "h4 files: $(ls md_bn/h4 | wc -l); metrics files: $(ls md_metrics/m4 | wc -l)"

      - name: Test the pre-registered hypotheses
        if: steps.data.outputs.ready == 'true'
        run: |
          python tools/v9/evidence_d2.py --md md_bn --metrics md_metrics --out evidence_d2 \
            --phase-b-evidence phase_b_evidence.json 2>&1 | tee evidence_d2/run.txt

      - name: Save the results on the evidence-d2-results branch
        if: always() && steps.data.outputs.ready == 'true'
        env:
          GIT_AUTHOR_NAME: perp-dex-radar
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: perp-dex-radar
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        run: |
          mkdir -p evidence_d2
          echo "$GITHUB_REF_NAME $GITHUB_SHA $(date -u +%Y-%m-%dT%H:%MZ)" > evidence_d2/run_meta.txt
          export GIT_INDEX_FILE="$RUNNER_TEMP/d2.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          for f in evidence_d2/*; do
            [ -f "$f" ] && git update-index --add --cacheinfo "100644,$(git hash-object -w "$f"),$(basename "$f")"
          done
          commit=$(git commit-tree "$(git write-tree)" -m "Phase D2 evidence $GITHUB_REF_NAME ${GITHUB_SHA::7}")
          git push --force origin "$commit:refs/heads/evidence-d2-results"
