name: Market context check

# v9: runs the market-context collector (v9/market.py) from a GitHub-hosted runner, where the scans run, and saves its
# output and log on the "market-results" branch (one commit, no history) so it can be reviewed from anywhere. Its
# hourly history goes to the "v9-market-history-dryrun" branch here; production (the Scan workflow on main) writes
# "v9-market-history". Read-only public data; nothing is published to the site.

on:
  push:
    branches: ["v9/**"]
    paths: ["v9/market.py", ".github/workflows/market.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-check
  cancel-in-progress: true

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the market context
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: mkdir -p out && (python -m v9.market --out out --history-branch v9-market-history-dryrun | tee out/run.txt) || true

      - name: Save on the market-results branch
        if: always()
        env:
          GIT_AUTHOR_NAME: perp-dex-radar
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: perp-dex-radar
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        run: |
          mkdir -p out
          cp out/data/v9/market.json out/market.json 2>/dev/null || true
          echo "$GITHUB_REF_NAME $GITHUB_SHA $(date -u +%Y-%m-%dT%H:%MZ)" > out/run_meta.txt
          export GIT_INDEX_FILE="$RUNNER_TEMP/market.index"
          git read-tree --empty
          for f in out/*.txt out/*.json; do
            [ -f "$f" ] && git update-index --add --cacheinfo "100644,$(git hash-object -w "$f"),$(basename "$f")"
          done
          commit=$(git commit-tree "$(git write-tree)" -m "Market context check $GITHUB_REF_NAME ${GITHUB_SHA::7}")
          git push --force origin "$commit:refs/heads/market-results"
